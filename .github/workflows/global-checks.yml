name: Global platform checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline unit, authorization, SQLite and privacy checks
        run: >-
          node --test
          tests/body-analysis.cjs tests/membership-policy.cjs
          tests/premium-backend.cjs tests/recommendation-engine.cjs
          tests/firebase-auth.cjs tests/localization-server.cjs
          tests/global-entitlements.cjs tests/global-schema.cjs
          tests/global-api.cjs tests/global-retailers.cjs
          tests/price-comparison.cjs tests/notifications.cjs
          tests/ai-catalog.cjs tests/ai-usage.cjs
          tests/openai-stylist.cjs tests/ai-stylist.cjs
      - name: Package public assets only
        run: node scripts/build-site.cjs
      - name: Check whitespace
        run: git diff --check
